<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject width="1000" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          width: 1000px; height: 400px; border-radius: 18px; overflow: hidden; position: relative;
          background:
            radial-gradient(circle at 80% 45%, rgba(124, 58, 237, .28) 0%, transparent 45%),
            radial-gradient(circle at 5% 0%, rgba(217, 70, 239, .14) 0%, transparent 40%),
            #09070f;
          font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; color: #fff;
          display: flex; align-items: center; padding: 0 64px;
        }
        .grid {
          position: absolute; inset: 0; opacity: .4;
          background-image: radial-gradient(#2b2245 1px, transparent 1px);
          background-size: 22px 22px;
        }
        .left { flex: 1; position: relative; }

        /* badge */
        .badge {
          display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #c4b5fd;
          padding: 6px 14px; border: 1px solid rgba(139, 92, 246, .3); border-radius: 999px;
          background: rgba(139, 92, 246, .1);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #a78bfa;
               animation: ping 2s ease-out infinite; }

        /* heading + name swap */
        h1 { font-size: 56px; font-weight: 800; line-height: 1.1; margin-top: 24px; }
        .names { position: relative; display: block; height: 66px; }
        .name {
          position: absolute; left: 0; top: 0; white-space: nowrap;
          background: linear-gradient(90deg, #a78bfa, #d946ef, #8b5cf6, #e879f9, #a78bfa);
          background-size: 300% 100%;
          -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .n1 { animation: shine 6s linear infinite, swapA 8s ease-in-out infinite; }
        .n2 { letter-spacing: 3px; animation: shine 6s linear infinite, swapB 8s ease-in-out infinite; }

        /* typewriter roles with | caret */
        .roles {
          position: relative; margin-top: 22px; height: 30px;
          font-family: Consolas, "Courier New", monospace; font-size: 20px; color: rgba(255,255,255,.75);
        }
        .roles b { color: #a78bfa; font-weight: 400; position: absolute; left: 0; top: 0; line-height: 30px; }
        .role {
          position: absolute; left: 22px; top: 0; height: 30px; line-height: 30px;
          white-space: nowrap; overflow: hidden; width: 0; opacity: 0;
          border-right: 2px solid #e879f9; padding-right: 2px;
        }
        .r1 { animation: t1 12s steps(18) infinite, caret .8s step-end infinite; }
        .r2 { animation: t2 12s steps(17) infinite, caret .8s step-end infinite; }
        .r3 { animation: t3 12s steps(10) infinite, caret .8s step-end infinite; }

        /* right: stack cards */
        .right { position: relative; width: 300px; height: 260px; }
        .line {
          position: absolute; left: 22px; top: 30px; bottom: 30px; width: 2px;
          background: linear-gradient(#a78bfa, #d946ef, #8b5cf6); opacity: .35;
        }
        .line.r { left: auto; right: 22px; background: linear-gradient(#8b5cf6, #d946ef, #a78bfa); }
        .pulse {
          position: absolute; left: 18px; width: 10px; height: 10px; border-radius: 50%;
          background: #f5d0fe; box-shadow: 0 0 14px #d946ef;
          animation: travel 3.6s ease-in-out infinite;
        }
        .pulse.r { left: auto; right: 18px; animation-delay: -1.8s; }
        .card {
          position: absolute; left: 0; right: 0; height: 52px; border-radius: 12px;
          background: #120f1f; border: 1px solid #2a2346;
          display: flex; align-items: center; gap: 12px; padding: 0 16px;
          font-family: Consolas, "Courier New", monospace; font-size: 14px; color: #ede9fe;
          animation: glow 3.6s ease-in-out infinite;
        }
        .card i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
        .card small { margin-left: auto; font-size: 11px; color: #7c6fa8; letter-spacing: 1px; }
        .k1 { top: 4px; }   .k1 i { background: #a78bfa; }
        .k2 { top: 104px; animation-delay: 1.2s; } .k2 i { background: #d946ef; }
        .k3 { top: 204px; animation-delay: 2.4s; } .k3 i { background: #8b5cf6; }

        /* keyframes */
        @keyframes shine { to { background-position: 300% 0; } }
        @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(167,139,250,.7); } 70%, 100% { box-shadow: 0 0 0 8px rgba(167,139,250,0); } }
        @keyframes caret { 50% { border-color: transparent; } }
        @keyframes swapA {
          0%, 42%   { opacity: 1; filter: blur(0); transform: translateY(0); }
          50%, 92%  { opacity: 0; filter: blur(8px); transform: translateY(-14px); }
          100%      { opacity: 1; filter: blur(0); transform: translateY(0); }
        }
        @keyframes swapB {
          0%, 42%   { opacity: 0; filter: blur(8px); transform: translateY(14px); }
          50%, 92%  { opacity: 1; filter: blur(0); transform: translateY(0); }
          100%      { opacity: 0; filter: blur(8px); transform: translateY(14px); }
        }
        /* each role owns 1/3 of the 12s loop: type, hold, delete */
        @keyframes t1 {
          0%       { width: 0; opacity: 1; }
          11%      { width: 18.6ch; }
          24%      { width: 18.6ch; }
          32%      { width: 0; opacity: 1; }
          33%, 100%{ width: 0; opacity: 0; }
        }
        @keyframes t2 {
          0%, 33%  { width: 0; opacity: 0; }
          33.4%    { width: 0; opacity: 1; }
          44%      { width: 17.6ch; }
          57%      { width: 17.6ch; }
          65%      { width: 0; opacity: 1; }
          66%, 100%{ width: 0; opacity: 0; }
        }
        @keyframes t3 {
          0%, 66%  { width: 0; opacity: 0; }
          66.4%    { width: 0; opacity: 1; }
          75%      { width: 10.6ch; }
          90%      { width: 10.6ch; }
          98%      { width: 0; opacity: 1; }
          100%     { width: 0; opacity: 0; }
        }
        @keyframes travel { 0% { top: 25px; } 50% { top: 225px; } 100% { top: 25px; } }
        @keyframes glow {
          0%, 100% { border-color: #2a2346; box-shadow: none; }
          15% { border-color: #a78bfa; box-shadow: 0 0 18px rgba(167,139,250,.25); }
          30% { border-color: #2a2346; box-shadow: none; }
        }
        /* walking cat */
        .cat { position: absolute; bottom: 6px; left: -110px; width: 88px; height: 55px;
               animation: walk 18s linear infinite; z-index: 5; }
        .cat svg { width: 100%; height: 100%; overflow: visible; }
        .cat .bob { animation: bob .5s ease-in-out infinite; }
        .cat .leg { transform-box: fill-box; transform-origin: 50% 0; }
        .cat .la { animation: stepA .5s ease-in-out infinite; }
        .cat .lb { animation: stepB .5s ease-in-out infinite; }
        .cat .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: tail 1.6s ease-in-out infinite; }
        .cat .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
        .shadow { position: absolute; left: 14px; right: 10px; bottom: 0; height: 5px; border-radius: 50%;
                  background: rgba(167,139,250,.25); filter: blur(2px); }
        @keyframes walk { from { transform: translateX(0); } to { transform: translateX(1220px); } }
        @keyframes bob { 50% { transform: translateY(-1.5px); } }
        @keyframes stepA { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
        @keyframes stepB { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
        @keyframes tail { 50% { transform: rotate(-14deg); } }
        @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      </style>

      <div class="wrap">
        <div class="grid"></div>
        <div class="left">
          <div class="badge"><span class="dot"></span>Open to new opportunities · 7 mo. of experience</div>
          <h1>Hi, I'm
            <span class="names">
              <span class="name n1">Bao Vu</span>
              <span class="name n2">EMOLITE</span>
            </span>
          </h1>
          <div class="roles">
            <b>&gt;</b>
            <span class="role r1">Software Developer</span>
            <span class="role r2">Angular Developer</span>
            <span class="role r3">IT Student</span>
          </div>
        </div>

        <div class="right">
          <div class="line"></div>
          <div class="line r"></div>
          <div class="pulse"></div>
          <div class="pulse r"></div>
          <div class="card k1"><i></i>Angular · TypeScript<small>UI</small></div>
          <div class="card k2"><i></i>ASP.NET Core · C#<small>API</small></div>
          <div class="card k3"><i></i>PostgreSQL · EF Core<small>DATA</small></div>
        </div>
        <div class="cat">
          <div class="shadow"></div>
          <svg viewBox="0 0 80 50" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#c4b5fd"/>
              </linearGradient>
            </defs>
            <g class="leg lb"><rect x="21" y="33" width="5" height="13" rx="2.5" fill="#b9a8f7"/></g>
            <g class="leg la"><rect x="44" y="33" width="5" height="13" rx="2.5" fill="#b9a8f7"/></g>
            <g class="bob">
              <path class="tail" d="M17 27 C 8 25, 5 14, 10 7" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="34" cy="28" rx="19" ry="10" fill="url(#fur)"/>
              <path d="M48 13 L51 2 L57 10 Z" fill="#ede9fe"/>
              <path d="M59 10 L65 2 L66 14 Z" fill="#ede9fe"/>
              <path d="M51 11 L52 6 L55 10 Z" fill="#f0abfc"/>
              <path d="M61 10 L64 5 L64.5 12 Z" fill="#f0abfc"/>
              <circle cx="57" cy="20" r="10" fill="#ede9fe"/>
              <ellipse class="eye" cx="61" cy="18.5" rx="1.6" ry="2.4" fill="#2e1065"/>
              <ellipse class="eye" cx="55" cy="18.5" rx="1.6" ry="2.4" fill="#2e1065"/>
              <path d="M57.5 23 l1.5 1 l1.5 -1" fill="none" stroke="#a21caf" stroke-width="1" stroke-linecap="round"/>
              <circle cx="52" cy="23" r="1.8" fill="#f0abfc" opacity=".6"/>
              <circle cx="64" cy="23" r="1.8" fill="#f0abfc" opacity=".6"/>
            </g>
            <g class="leg la"><rect x="25" y="33" width="5" height="13" rx="2.5" fill="url(#fur)"/></g>
            <g class="leg lb"><rect x="48" y="33" width="5" height="13" rx="2.5" fill="url(#fur)"/></g>
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
