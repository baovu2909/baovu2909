<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject width="1000" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          width: 1000px; height: 400px; border-radius: 18px; overflow: hidden; position: relative;
          background: radial-gradient(circle at 80% 50%, #3a0a2a 0%, #0d0a18 55%);
          font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; color: #fff;
          display: flex; align-items: center; padding: 0 56px;
        }
        .left { flex: 1; }
        .badge {
          display: inline-flex; align-items: center; gap: 8px; font-size: 13px;
          padding: 6px 14px; border: 1px solid #4b3a8a; border-radius: 999px; background: #1a1430;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b6cff;
               animation: pulse 1.6s ease-in-out infinite; }
        h1 { font-size: 54px; font-weight: 800; line-height: 1.1; margin-top: 22px; }
        .name { color: #a98bff; display: block;
                animation: fadeUp .8s ease-out both .3s; }
        .typing {
          margin-top: 22px; font-family: Consolas, "Courier New", monospace; font-size: 20px; color: #ddd;
          display: inline-block; white-space: nowrap; overflow: hidden;
          border-right: 2px solid #a98bff; width: 0;
          animation: type 2.2s steps(20) 1s forwards, caret .8s step-end infinite;
        }
        .typing b { color: #a98bff; font-weight: 400; }
        .desc { margin-top: 18px; font-size: 14px; line-height: 1.7; color: #9a96aa; max-width: 470px; }

        .right { position: relative; width: 330px; height: 330px; }
        .photo {
          position: absolute; inset: 20px; border-radius: 26px; overflow: hidden;
          background: linear-gradient(160deg, #b0102a, #4a0612);
          box-shadow: 0 0 60px rgba(140, 60, 255, .35);
          animation: float 4s ease-in-out infinite;
        }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        .chip {
          position: absolute; font-size: 13px; font-weight: 600; padding: 6px 12px;
          border-radius: 999px; background: #1a1430; border: 1px solid #3a2f63; white-space: nowrap;
        }
        .c1 { top: 30px; left: -10px; } .c1 i { display:inline-block; width:8px; height:8px; border-radius:50%; background:#2ee6a6; margin-right:6px; }
        .c2 { bottom: 60px; right: -14px; }
        .c3 { bottom: 4px; left: 90px; }

        @keyframes type { to { width: 255px; } }
        @keyframes caret { 50% { border-color: transparent; } }
        @keyframes pulse { 50% { opacity: .3; } }
        @keyframes float { 50% { transform: translateY(-8px); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
      </style>

      <div class="wrap">
        <div class="left">
          <div class="badge"><span class="dot"></span>Sẵn sàng cho cơ hội mới · 7 tháng kinh nghiệm</div>
          <h1>Xin chào, tôi là<span class="name">Bảo</span></h1>
          <div class="typing"><b>&gt;</b> Software Developer</div>
          <p class="desc">Theo đuổi lập trình từ những ngày ở Sonadezi, sắp bước vào giảng đường UIT — song song đó là hành trình đi làm Software Developer chính thức.</p>
        </div>

        <div class="right">
          <div class="photo">
            <!-- THAY ẢNH: dán chuỗi base64 của ảnh vào sau "base64," -->
            <img src="data:image/jpeg;base64,DAN_BASE64_ANH_VAO_DAY" />
          </div>
          <div class="chip c1"><i></i>Angular Dev</div>
          <div class="chip c2">&lt;/&gt; TypeScript</div>
          <div class="chip c3">UIT 2026</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
